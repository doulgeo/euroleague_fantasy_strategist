<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}EuroLeague Fantasy{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}">Home</a>
    <a href="{{ url_for('draft') }}">Draft</a>
    <a href="{{ url_for('managers_index') }}">Managers</a>
    <a href="{{ url_for('transactions') }}">Transactions</a>
    <a href="{{ url_for('transfers') }}">Transfers</a>
    <a href="{{ url_for('lineup') }}">Lineup</a>
    <a href="{{ url_for('sync_page') }}">Sync</a>
    <a href="{{ url_for('how_it_works') }}">How this works</a>
  </nav>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul class="flashes">
        {% for category, message in messages %}
          <li class="flash-{{ category }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
